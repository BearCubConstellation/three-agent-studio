name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck scene contract
        run: pnpm --filter @three-agent/scene-contract typecheck
      - name: Typecheck editor
        run: pnpm --filter @three-agent/editor-web typecheck
      - name: Typecheck MCP server
        run: pnpm --filter @three-agent/scene-mcp typecheck
      - name: Build
        run: pnpm build
